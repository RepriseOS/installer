# Licences cargo-about may pick for a dependency, in order of preference. The
# same set as the allow list in src-tauri/deny.toml; scripts/third_party.py checks it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause-Patent",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
    "LGPL-2.1-or-later",
    "GPL-3.0-only",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
