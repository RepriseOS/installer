# Every dependency must be usable in a GPL-3.0-only program.

[graph]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# rusb's "vendored" feature compiles libusb (LGPL-2.1-or-later) into the crate.
crate = "libusb1-sys"
expression = "MIT AND LGPL-2.1-or-later"
license-files = []
